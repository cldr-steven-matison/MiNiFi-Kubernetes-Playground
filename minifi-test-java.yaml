apiVersion: v1
kind: Service
metadata:
  name: minifi-test-java-service
spec:
  type: NodePort
  selector:
    app: minifi-test-java
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30081        # different NodePort than the C++ deployment (30080)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minifi-test-java
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minifi-test-java
  template:
    metadata:
      labels:
        app: minifi-test-java
    spec:
      containers:
      - name: minifi-java
        image: minifi-test-java:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "512Mi"     # C++ runs fine unbounded/~128Mi; Java JVM needs 512Mi minimum
            cpu: "250m"
          limits:
            memory: "1Gi"
        readinessProbe:
          # Java's ListenHTTP only accepts POST on /contentListener and returns
          # 405 to a GET — an httpGet probe (like the C++ deployment uses)
          # permanently fails here. Field-verified 2026-07-29. Use a TCP check
          # against the Jetty listener instead.
          tcpSocket:
            port: 8080
          initialDelaySeconds: 60   # JVM + MiNiFi bootstrap takes 30-60s; C++ uses 5s
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 75
          periodSeconds: 10
